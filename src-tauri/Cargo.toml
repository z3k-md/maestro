[package]
name = "maestro"
version = "1.1.2"
description = "Windows Audio Manager"
authors = ["z3k"]
edition = "2024"

[lib]
name = "maestro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
flexi_logger = "0.31"
log = "0.4"
windows-volume-control = { git = "https://github.com/z3k-md/windows-volume-control.git", branch = "main" }
windows-key-listener = "0.2"
windows-icons = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }
